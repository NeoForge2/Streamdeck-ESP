select:
  - platform: template
    id: slot22_type
    name: "Slot 22 - type"
    optimistic: true
    options: ["bouton", "barre", "texte"]
    initial_option: "bouton"
    on_value:
      - lambda: |-
          if (x == "barre") {
            lv_obj_clear_flag(id(slot22_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(slot22_value_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot22_barre_dec), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot22_barre_inc), LV_OBJ_FLAG_HIDDEN);
