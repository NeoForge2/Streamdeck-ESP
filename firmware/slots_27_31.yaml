    on_value:
      - lambda: |-
          if (x == "barre") {
            lv_obj_clear_flag(id(slot27_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(slot27_value_lbl), LV_OBJ_FLAG_HIDDEN);
