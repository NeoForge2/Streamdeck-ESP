switch:
  - platform: template
    id: slot12_visible
    name: "Slot 12 - visible"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: |-
          if (x) {
            lv_obj_clear_flag(id(slot12_btn), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(slot12_btn), LV_OBJ_FLAG_HIDDEN);
