# Entites des emplacements 12 a 16 (voir docs/ARCHITECTURE.md pour le
# systeme de 16 emplacements configurables). Genere, ne pas editer a la main.
text:
  - platform: template
    id: slot12_label
    name: "Slot 12 - libelle"
    mode: text
    optimistic: true
    initial_value: "Slot 12"
    max_length: 24
    on_value:
      - lvgl.label.update: { id: slot12_title, text: !lambda "return x;" }
  - platform: template
    id: slot12_value
    name: "Slot 12 - valeur"
    mode: text
    optimistic: true
    initial_value: ""
    max_length: 24
    on_value:
      - lvgl.label.update: { id: slot12_value_lbl, text: !lambda "return x;" }
      - lambda: |-
          char *endptr;
          long v = strtol(x.c_str(), &endptr, 10);
          if (endptr != x.c_str()) {
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            lv_bar_set_value(id(slot12_bar), (int) v, LV_ANIM_OFF);
          }
  - platform: template
    id: slot12_icon
    name: "Slot 12 - icone"
    mode: text
    optimistic: true
    initial_value: ""
    max_length: 20
    on_value: [{if: {condition: {lambda: 'return x.rfind("REAL:", 0) == 0;'}, then: [{lambda: "lv_obj_add_flag(id(slot12_icon_lbl), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(slot12_icon_widget), LV_OBJ_FLAG_HIDDEN);"}, {online_image.set_url: {id: slot12_icon_img, url: !lambda 'return id(pc_base_url_text).state + "/slot-icon/12.png?v=" + x.substr(5);'}}], else: [{lambda: "lv_obj_clear_flag(id(slot12_icon_lbl), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(slot12_icon_widget), LV_OBJ_FLAG_HIDDEN);"}, {lvgl.label.update: {id: slot12_icon_lbl, text: !lambda "return x;"}}]}}]
  - platform: template
    id: slot12_color
    name: "Slot 12 - couleur"
    mode: text
    optimistic: true
    initial_value: ""
    max_length: 7
    on_value:
      - lvgl.obj.update: {id: slot12_btn, bg_color: !lambda 'return x.length() == 7 ? Color(strtoul(x.substr(1,2).c_str(), nullptr, 16), strtoul(x.substr(3,2).c_str(), nullptr, 16), strtoul(x.substr(5,2).c_str(), nullptr, 16)) : Color(0x0F, 0x29, 0x42);'}
