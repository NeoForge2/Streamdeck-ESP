# Popup tactile adaptee pour un lecteur multimedia (voir ha_popup.yaml et
# pc-app/streamdeck_companion/ha_popup.py) - extraite dans son propre
# fichier pour rester sous la limite de lignes de package.yaml. Les
# ampoules restent en tap = bascule directe, pas de popup pour elles.
- obj:
    id: ha_popup_panel
    width: 480
    height: 220
    align: center
    hidden: true
    bg_color: 0x0F2942
    bg_opa: "96%"
    border_color: 0x00B4D8
    border_width: 2
    radius: 16
    pad_all: 16
    layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: start, pad_row: 14}
    widgets:
      - label: {id: ha_popup_title_lbl, text: "", text_font: font_title, text_color: 0xFFFFFF, long_mode: dot, width: 400}
      - obj: {width: "100%", height: 56, bg_opa: transp, border_width: 0, layout: {type: flex, flex_flow: row, flex_align_cross: center, flex_align_main: space_evenly}, widgets: [{switch: {id: ha_popup_power_lvgl, width: 70, height: 36, on_value: [{if: {condition: {lambda: "return x != id(ha_popup_power_switch).state;"}, then: [{if: {condition: {lambda: "return x;"}, then: [{switch.turn_on: ha_popup_power_switch}], else: [{switch.turn_off: ha_popup_power_switch}]}}]}}]}}, {obj: {id: ha_popup_transport_row, bg_opa: transp, border_width: 0, layout: {type: flex, flex_flow: row, flex_align_cross: center, pad_column: 16}, widgets: [{button: {width: 56, height: 56, radius: 28, bg_color: 0x1E4060, border_color: 0x00B4D8, border_width: 1, on_click: [{event.trigger: {id: action_button_event, event_type: "popup_prev"}}], widgets: [{label: {text: "", text_font: font_icons, text_color: 0xFFFFFF, align: center}}]}}, {button: {width: 56, height: 56, radius: 28, bg_color: 0x1E4060, border_color: 0x00B4D8, border_width: 1, on_click: [{event.trigger: {id: action_button_event, event_type: "popup_next"}}], widgets: [{label: {text: "", text_font: font_icons, text_color: 0xFFFFFF, align: center}}]}}]}}]}
      - obj: {width: "100%", height: 44, bg_opa: transp, border_width: 0, layout: {type: flex, flex_flow: row, flex_align_cross: center, flex_align_main: start}, widgets: [{label: {text: "Volume", text_font: font_body, text_color: 0x8FAFC7, width: 84}}, {slider: {id: ha_popup_value_slider, width: 260, height: 28, min_value: 0, max_value: 100, value: 0, radius: 14, pad_all: 0, bg_color: 0x1A3A52, indicator: {bg_color: 0xFFE9B0, radius: 14}, knob: {width: 24, height: 24, radius: 12, bg_opa: 0, border_color: 0xFFFFFF, border_width: 3}, on_value: [{if: {condition: {lambda: "return (int) x != (int) id(ha_popup_value_number).state;"}, then: [{number.set: {id: ha_popup_value_number, value: !lambda "return x;"}}]}}]}}, {label: {id: ha_popup_value_lbl, text: "0%", text_font: font_mono, text_color: 0xFFFFFF, width: 60}}]}

# Sortie de la popup (voir ha_popup_active_switch)
- button: {id: ha_popup_close_btn, width: 40, height: 40, radius: 20, align: top_right, x: -8, y: 8, hidden: true, bg_color: 0x1E4060, border_color: 0x00B4D8, border_width: 1, on_click: [{event.trigger: {id: action_button_event, event_type: "close_ha_popup"}}], widgets: [{label: {text: "X", text_font: font_body, text_color: 0xFFFFFF, align: center}}]}
