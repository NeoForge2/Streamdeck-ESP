# Sortie du mode reglage couleur (voir color_mode_active_switch)
- button: {id: color_mode_close_btn, width: 40, height: 40, radius: 20, align: top_right, x: -8, y: 8, hidden: true, bg_color: 0x1E4060, border_color: 0x00B4D8, border_width: 1, on_click: [{event.trigger: {id: action_button_event, event_type: "close_color_mode"}}], widgets: [{label: {text: "X", text_font: font_body, text_color: 0xFFFFFF, align: center}}]}
