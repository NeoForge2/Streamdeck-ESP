# Panneau du mode reglage couleur (voir color_mode_active_switch, appui
# long sur un emplacement lie a une ampoule) - extrait de package.yaml
# pour rester sous la limite de lignes de ce fichier. Les 3 lignes
# (teinte/chaleur/intensite) partagent maintenant le meme rendu : piste
# pleine largeur arrondie (radius 14, clip_corner) et curseur identique
# (slider LVGL, knob rond en anneau - pas plein, juste une bordure) -
# seule la teinte/chaleur gardent en plus
# un degrade statique en 30 blocs de couleur DERRIERE le slider (dont le
# fond/l'indicateur sont rendus transparents : seul le knob est visible,
# la piste colore vient des blocs), pour un "arc-en-ciel" toujours entier
# plutot qu'un remplissage progressif. Le slider capte le glissement
# tactile nativement (LVGL) et pousse la valeur choisie vers l'entite
# number correspondante via number.set - meme entite que celle deja
# pilotee par les encodeurs (voir package.yaml, color_mode_*_number),
# donc les deux sources restent synchronisees (voir aussi
# color_mode.py::handle_touch cote appli PC).
- obj:
    id: color_mode_panel
    width: 640
    height: 260
    align: center
    hidden: true
    bg_color: 0x0F2942
    bg_opa: "96%"
    border_color: 0x00B4D8
    border_width: 2
    radius: 16
    pad_all: 16
    layout: {type: flex, flex_flow: column, flex_align_cross: center, flex_align_main: start, pad_row: 14}
    widgets:
      - label: {text: "Reglage couleur", text_font: font_title, text_color: 0xFFFFFF}
