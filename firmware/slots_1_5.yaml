select:
  - platform: template
    id: slot1_type
    name: "Slot 1 - type"
    optimistic: true
    options: ["bouton", "barre", "texte"]
    initial_option: "bouton"
    on_value:
      - lambda: |-
          if (x == "barre") {
            lv_obj_clear_flag(id(slot1_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(slot1_value_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot1_barre_dec), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot1_barre_inc), LV_OBJ_FLAG_HIDDEN);
          } else if (x == "texte") {
            lv_obj_add_flag(id(slot1_bar), LV_OBJ_FLAG_HIDDEN);
