select:
  - platform: template
    id: slot32_type
    name: "Slot 32 - type"
    optimistic: true
    options: ["bouton", "barre", "texte"]
    initial_option: "bouton"
    on_value:
      - lambda: |-
          if (x == "barre") {
            lv_obj_clear_flag(id(slot32_bar), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(slot32_value_lbl), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot32_barre_dec), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(slot32_barre_inc), LV_OBJ_FLAG_HIDDEN);
