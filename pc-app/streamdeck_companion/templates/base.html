<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Stream Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <div class="brand">STREAM DECK</div>
  <div class="nav-links">
    <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'home' else '' }}">Accueil</a>
    <a href="{{ url_for('settings') }}" class="{{ 'active' if active_page == 'settings' else '' }}">&#9881; Reglages</a>
  </div>
</nav>
<div class="page">
  {% if error %}<div class="banner-err">Echec : {{ error }}</div>{% endif %}
  {% if saved %}<div class="banner-ok">Enregistre et envoye a l'ecran.</div>{% endif %}
  {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='property-inspector.js') }}"></script>
<script src="{{ url_for('static', filename='action-library.js') }}"></script>
</body>
</html>
